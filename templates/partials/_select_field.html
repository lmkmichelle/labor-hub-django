<div class="form-field not-format">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ label }}{% if required %}<span class="text-red-600 ms-0.5" aria-hidden="true">*</span>{% endif %}
    </label>
    <select id="{{ field.id_for_label }}"{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %} name="{{ field.name }}"
            class="form-select block w-full"
            {% if required %}required{% endif %}>
        {% if empty_label %}
            <option value="">{{ empty_label }}</option>
        {% endif %}
        {% for value, display in field.field.choices %}
            {% if value %}
                <option value="{{ value }}" {% if field.value|stringformat:"s" == value|stringformat:"s" %}selected{% endif %}>
                    {{ display }}
                </option>
            {% endif %}
        {% endfor %}
    </select>
    {% if field.errors %}
        <p id="{{ field.id_for_label }}-error" class="mt-2 text-sm text-red-600">{{ field.errors.0 }}</p>
    {% endif %}
</div>
