{% extends "emails/_layout.html" %}
{% block title %}An update on your Labor Hub application{% endblock %}
{% block content %}
  <!-- djlint:off -->
  <p style="margin:0 0 16px; font-size:16px;">Hi {{ application.first_name|default:application.email }},</p>
  <div style="margin:0; font-size:15px; color:#374151;">{{ message|urlize|linebreaks }}</div>
  <!-- djlint:on -->
{% endblock %}
{% block footer %}
  <!-- djlint:off -->
  <p style="margin:0;">The Labor Hub team</p>
  <!-- djlint:on -->
{% endblock %}
