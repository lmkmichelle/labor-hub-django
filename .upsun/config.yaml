applications:
  laborhub:
    # Composable image: Python is the primary runtime (Django/gunicorn) and is
    # started automatically; Node.js is included only so the build hook can
    # compile the Tailwind CSS bundle. "stack" replaces the single-runtime
    # "build"/"flavor" key.
    type: "composable:26.05"
    stack:
      runtimes:
        - "python@3.13"
        - "nodejs@22"

    # Exposes DATABASE_HOST/PORT/USERNAME/PASSWORD/PATH to the app. The MariaDB
    # service publishes a "mysql" endpoint; PyMySQL speaks to it via
    # django.db.backends.mysql (see nole/__init__.py + .environment).
    relationships:
      database: "db:mysql"

    hooks:
      # Build phase: no services/database yet. Install Python deps, compile the
      # Tailwind CSS (npm) into static/src/output.css, then pre-build the
      # django-compressor offline bundle (all baked into the read-only image).
      build: |
        set -eux
        pip install --upgrade pip
        pip install -r requirements.txt
        npm install
        npm run build
        python manage.py compress
      # Deploy phase: the database and the writable mounts are available.
      deploy: |
        set -eux
        python manage.py collectstatic --noinput
        python manage.py migrate

    # Persistent, writable directories. STATIC_ROOT (staticfiles) receives the
    # output of collectstatic; MEDIA_ROOT (media) stores user uploads such as
    # avatars, resumes and paper PDFs.
    mounts:
      "staticfiles":
        source: storage
        source_path: staticfiles
      "media":
        source: storage
        source_path: media

    web:
      commands:
        start: "gunicorn nole.wsgi:application -b unix:$SOCKET"
      upstream:
        socket_family: unix
      locations:
        "/":
          passthru: true
        "/static":
          allow: true
          expires: 1h
          root: "staticfiles"
        "/media":
          allow: true
          expires: 1h
          root: "media"

routes:
  "https://{default}/":
    type: upstream
    upstream: "laborhub:http"

services:
  db:
    type: "mariadb:12.3"
