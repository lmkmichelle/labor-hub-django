applications:
  laborhub:
    type: "python:3.13"

    # Only the hooks below run (skip the default Python build behaviour).
    build:
      flavor: none

    # Exposes DATABASE_HOST/PORT/USERNAME/PASSWORD/PATH to the app. The MariaDB
    # service publishes a "mysql" endpoint; PyMySQL speaks to it via
    # django.db.backends.mysql (see nole/__init__.py + .environment).
    relationships:
      database: "db:mysql"

    hooks:
      # Build phase: install Python deps and pre-build the django-compressor
      # offline bundle from the committed static/src/output.css.
      #
      # NOTE: the Tailwind CSS is intentionally NOT compiled here. The Tailwind
      # v4 CLI (Rust/oxide engine) gets OOM-killed in Upsun's build container.
      # Rebuild the stylesheet locally with `npm run build` and commit
      # static/src/output.css whenever the styles change.
      build: |
        set -eux
        pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py compress
      # Deploy phase: the database and the writable mounts are available.
      deploy: |
        set -eux
        python manage.py collectstatic --noinput
        python manage.py migrate
        # Seed the affiliation picker's University table on first deploy only.
        # Re-importing ~10k rows from Hipolabs on every deploy is wasted work;
        # run `python manage.py import_universities` by hand to refresh it.
        # `|| true` keeps a Hipolabs outage from failing the deploy; the
        # picker falls back to a live per-country fetch in that case.
        python manage.py import_universities --if-empty || true
        # Same idea for the event-location city picker's City table.
        python manage.py import_cities --if-empty || true

    # Persistent, writable directories. STATIC_ROOT (staticfiles) receives the
    # output of collectstatic; MEDIA_ROOT (media) stores user uploads such as
    # avatars, resumes and paper PDFs.
    mounts:
      "staticfiles":
        source: storage
        source_path: staticfiles
      "media":
        source: storage
        source_path: media

    # Scheduled email digests (accounts/management/commands/send_digests.py).
    # Upsun cron specs are UTC and the project's TIME_ZONE is UTC as well, so
    # 12:00 UTC is roughly 08:00 in America/New_York (07:00 outside daylight
    # saving) -- a morning delivery for the Cornell readership rather than an
    # overnight one. Each cohort matches a Profile.digest_frequency value; a
    # user whose digest window turns up no new approved content is skipped, so
    # a quiet week sends nothing.
    crons:
      digest-weekly:
        spec: "0 12 * * 1"
        commands:
          start: "python manage.py send_digests --frequency weekly"
      digest-monthly:
        spec: "0 12 1 * *"
        commands:
          start: "python manage.py send_digests --frequency monthly"
      # Topic/country alerts (accounts/management/commands/send_alerts.py),
      # one cohort, run weekly on Fridays so the week's approved content is
      # in by the time it goes out.
      alerts-weekly:
        spec: "0 12 * * 5"
        commands:
          start: "python manage.py send_alerts"

    web:
      commands:
        start: "gunicorn nole.wsgi:application -b unix:$SOCKET"
      upstream:
        socket_family: unix
      locations:
        "/":
          passthru: true
        "/static":
          allow: true
          expires: 1h
          root: "staticfiles"
        "/media":
          allow: true
          expires: 1h
          root: "media"

routes:
  "https://{default}/":
    type: upstream
    upstream: "laborhub:http"

services:
  db:
    type: "mariadb:12.3"
